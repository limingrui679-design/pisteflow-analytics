<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc">
  <title id="title">PisteFlow internal benchmark results</title>
  <desc id="desc">Elo and pose models beat simple baselines; ranking and static lunge models do not. Results are internal.</desc>
  <rect width="1200" height="455" rx="22" fill="#081321"/>
  <text x="54" y="55" fill="#f4fbff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="750">Internal baselines—including the negative results</text>
  <text x="54" y="83" fill="#9fc4d9" font-family="Inter,Arial,sans-serif" font-size="15">No metric below is external validation, referee accuracy, or coaching impact.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="50" y="112" width="535" height="132" rx="16" fill="#10283e" stroke="#2b9e7e"/>
    <text x="76" y="145" fill="#8ff0ce" font-size="13" font-weight="700">THREE-WEAPON PRE-DAY ELO · 16,365 TEST BOUTS</text>
    <text x="76" y="182" fill="#ffffff" font-size="31" font-weight="750">74.0%</text>
    <text x="174" y="182" fill="#b7d0df" font-size="15">accuracy</text>
    <rect x="76" y="203" width="360" height="10" rx="5" fill="#263f52"/>
    <rect x="76" y="203" width="266" height="10" rx="5" fill="#35c99a"/>
    <text x="452" y="213" fill="#b7d0df" font-size="13">AUC 0.817</text>
    <text x="76" y="233" fill="#87a8bb" font-size="12">uninformative baseline: 49.7% · source order randomized</text>

    <rect x="615" y="112" width="535" height="132" rx="16" fill="#10283e" stroke="#7157c8"/>
    <text x="641" y="145" fill="#c2b7ff" font-size="13" font-weight="700">FOIL POSE · 9,328 CLIPS · 1,332 HELD-OUT GROUPS</text>
    <text x="641" y="182" fill="#ffffff" font-size="31" font-weight="750">46.5%</text>
    <text x="739" y="182" fill="#b7d0df" font-size="15">balanced accuracy</text>
    <rect x="641" y="203" width="360" height="10" rx="5" fill="#263f52"/>
    <rect x="641" y="203" width="167" height="10" rx="5" fill="#9178eb"/>
    <text x="1017" y="213" fill="#b7d0df" font-size="13">macro-F1 0.464</text>
    <text x="641" y="233" fill="#87a8bb" font-size="12">majority baseline balanced accuracy: 33.3% · no scoring lights</text>

    <rect x="50" y="274" width="1100" height="126" rx="16" fill="#14212d" stroke="#c48b35"/>
    <text x="76" y="307" fill="#ffd28d" font-size="13" font-weight="700">NO VERIFIED LIFT OVER A SIMPLE BASELINE</text>
    <text x="76" y="341" fill="#ffffff" font-size="18" font-weight="700">Ranking trajectory</text>
    <text x="260" y="341" fill="#b7d0df" font-size="15">model MAE 2.207 vs persistence 2.153 rank places</text>
    <text x="76" y="374" fill="#ffffff" font-size="18" font-weight="700">Static lunge velocity</text>
    <text x="260" y="374" fill="#b7d0df" font-size="15">model RMSE 0.179 vs mean baseline 0.177 m/s</text>
    <text x="760" y="341" fill="#ffffff" font-size="18" font-weight="700">Advance lunge</text>
    <text x="920" y="341" fill="#b7d0df" font-size="15">0.449 vs 0.477 m/s</text>
    <text x="760" y="374" fill="#87a8bb" font-size="13">small internal lift; N=45, cross-sectional only</text>

    <text x="600" y="431" text-anchor="middle" fill="#87a8bb" font-size="13">Exact protocols, folds, hashes, confusion matrices, and per-weapon results live in reports/model-cards/.</text>
  </g>
</svg>
