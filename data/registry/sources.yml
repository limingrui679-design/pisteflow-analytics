schema_version: 1
reviewed_on: 2026-08-16
sources:
  - id: cmu_mocap_swordplay
    url: https://mocap.cs.cmu.edu/search.php?subjectnumber=&motion=swordplay
    status: usable_permissive_adjacent_domain_not_sport_fencing
    repository_policy: acquire and checksum the ASF skeleton plus three AMC motion trials; use only for motion-format and out-of-domain checks
    scope: one subject, three 120-Hz swordplay trials, 4,784 motion frames
    notes: CMU explicitly permits copying, modification, and redistribution, but the source label is swordplay rather than Olympic fencing. Do not map it to epee, foil, or sabre or count it as fencing-athlete training data.

  - id: paris_2024_official_fencing_results_book
    url: https://olympics.com/OG2024/pdf/OG2024/FEN/OG2024_FEN_B99_FEN-------------------------------.pdf
    status: official_public_results_local_analysis_no_explicit_reuse_license
    repository_policy: keep the official PDF and privacy-minimized row-level Parquet local; publish parser, source hash, exact aggregates, and validation counts
    scope: all 12 Paris 2024 Olympic fencing events across epee, foil, and sabre; 212 individual bouts, 72 team matches, and 648 team relay bouts
    notes: Athlete names are replaced with event-scoped stable pseudonyms in local processed tables. Results are not video-derived actions, live scoring, training interventions, or evidence of causal coaching effects.

  - id: harmony4d_fencing_multiview_pose
    url: https://huggingface.co/datasets/Jyun-Ting/Harmony4D
    status: adjacent_domain_pose_inventory_not_modern_sport_fencing
    repository_policy: publish the exact five-archive inventory, LFS SHA-256 values, the Voxel51 sword-record catalog, and one locally verified preview audit; do not commit the 117.1 GB official archives or treat the mirror as redistributable
    scope: five official train/test archives totaling 109.015 GiB plus a mirror catalog containing 204 sword-labelled records from eight sequences, including 196 video views and eight 3D scene records
    notes: Visual review of one 30.05-second 4K view shows staged stick/sword sparring in ordinary clothing, not modern epee, foil, or sabre. The 204 catalog records are synchronized views and 3D records rather than independent bouts, and this source is limited to adjacent-domain pose or occlusion pretraining.

  - id: european_fencing_confederation_result_catalog
    url: https://www.fencing-efc.eu/results
    status: public_event_catalog_link_only_no_explicit_reuse_license
    repository_policy: publish factual event landing and download links plus aggregates; do not republish athlete-level result files without a separate rights review
    scope: paginated European event catalog from the 2009-10 season onward across epee, foil, and sabre, including result-download links
    notes: Catalog events are not bouts or athlete observations. Future calendar entries remain separate from completed events, and unlabeled SVG gender/event-type icons are not guessed.

  - id: zenodo_fencing_movement_error_videos
    url: https://doi.org/10.5281/zenodo.7643646
    status: usable_cc_by_4_controlled_training_video
    repository_policy: publish the audited member manifest, labels, checksums, attribution, and aggregate results; keep the 39.8 GB video archives local
    scope: 1,289 original controlled-training videos plus 1,289 horizontal-mirror augmentations across counterattack, fleche, lunge, and parry; 494 originals have multi-label error annotations
    notes: Mirrors are not independent samples. The deposit has no athlete identity or weapon field, so evaluation can prevent mirror leakage but cannot claim athlete-independent or weapon-specific generalization.

  - id: usa_fencing_national_tournament_dataset
    url: https://www.kaggle.com/datasets/rivkalipkovitz/usa-fencing-national-tournament-dataset
    status: usable_agpl3_local_row_level
    repository_policy: cache raw and privacy-minimized row tables locally; publish code, hashes, attribution, and aggregates
    scope: 2016-2020 USA national events across epee, foil, and sabre
    notes: Names, clubs, countries, and referee fields are dropped; this is not all US fencing and includes youth events.

  - id: france_geocoded_fencing_licence_census
    url: https://www.data.gouv.fr/datasets/donnees-geocodees-issues-du-recensement-des-licences-et-clubs-aupres-des-federations-sportives-agreees-par-le-ministere-charge-des-sports
    status: usable_etalab_open_licence_annual_aggregate
    repository_policy: stream the 2011-2023 official multi-sport files, retain every French Fencing Federation code-110 geography row and normalized table locally, and publish code, resource IDs, source hashes, attribution, annual totals, and schema cautions
    scope: thirteen annual geocoded fencing-licence censuses with municipality or municipality-QPV rows and available sex and age-band counts
    notes: Licences are annual memberships by residence rather than unique athletes or practice locations; people can recur across years, post-2019 geography and age schemas differ, and the producer describes geocoded values as estimates.

  - id: france_fencing_clubs_and_equipment
    url: https://data.sports.gouv.fr/
    status: usable_etalab_open_licence_infrastructure
    repository_policy: publish privacy-minimized Data.Sports exports, code, hashes, attribution, aggregates, and current-snapshot caveats
    scope: 2022-2024 French Fencing Federation club and approved-establishment counts by department plus the current national equipment inventory filtered to listed fencing activities
    notes: Club and facility rows are infrastructure context rather than athletes, sessions, bouts, current availability guarantees, or evidence of programme quality and adoption.

  - id: rt_fencing_touch_time_images
    url: https://github.com/CodLiver/RT-Fencing
    status: usable_noncommercial_local_training
    repository_policy: publish metadata and grouped evaluation; keep the 937 MB image archive local
    scope: 12,408 touch-time images, including 6,504 originals, in five upstream action classes
    notes: Weapon labels are unavailable; mirrored samples and source-match codes must remain grouped.

  - id: facts_fine_grained_fencing_actions
    url: https://anonymous.4open.science/r/FACTS-B1C5
    status: verified_public_annotations_media_link_only_no_license
    repository_policy: cache annotations and media only locally; publish processing code, checksums, duplicate/conflict audit, and aggregates
    scope: 6,400 balanced annotation rows across eight left/right attack, counter-attack, remise, and riposte labels, resolving to 2,429 unique annotation rows and 2,419 unique clip paths from 401 source-video groups
    notes: The CSV repeats 3,971 exact rows and one clip path has conflicting labels; repeated rows are not independent clips or distinguishable horizontal flips. The 32.6 GB Dropbox media folder has no verified redistribution license and no weapon labels.

  - id: cmu_fencing_score_detection
    url: https://huggingface.co/datasets/mastefan/2025-24679-Project-One-Fencing-Score-Detection
    status: mixed_local_research_and_metadata_only
    repository_policy: keep embedded frames locally; publish sanitized hashes, grouped metadata, code, and aggregate evaluation only
    scope: 1,116 embedded foil frames from ten bouts, 2,226 matched red/green signal rows, and 825 YOLO path-and-box rows
    notes: Only 59 embedded frames are labelled touch and only ten signal rows are touch peaks. The YOLO Parquet has paths and boxes but no image pixels; source-group leakage must be audited instead of trusting its upstream split.

  - id: tokyo_2020_epee_touch_events
    url: https://github.com/OscarFawcett/Epee-Fencing-Tokyo
    status: usable_mit_pseudonymized_event_rows
    repository_policy: cache the pinned workbook; publish direct-name-free event rows, processing code, checksums, attribution, and aggregates
    scope: 225 ordered rows from ten Tokyo 2020 Olympic epee bouts, including 205 rows with a scorer plus one double-touch row without a single scorer, body target, blade contacts, piste area, clock, and period
    notes: The other 19 rows without a scorer are retained as uncoded or no-touch exchanges; this is a manually coded partial Olympic sample rather than all epee bouts or sensor ground truth.

  - id: log45_sabre_touch_clips
    url: https://github.com/Log45/Fencing-Judge-AI
    status: public_link_only_unknown_license
    repository_policy: publish a file-link manifest; do not redistribute media
    scope: 367 real sabre touch-length clips across five source-video groups

  - id: mit_ocw_fencing_demonstrations
    url: https://ocw.mit.edu/courses/pe-740-fencing-spring-2007/pages/video/
    status: usable_cc_by_nc_sa_3
    repository_policy: download locally with attribution and checksum; publish manifest
    scope: 23 instructional clips covering footwork, thrusts, lunges, and parry-riposte

  - id: internet_archive_fencing_videos
    url: https://archive.org/details/Flickr-29467365844
    status: usable_item_level_cc_noncommercial_with_one_no_derivatives_asset
    repository_policy: download and checksum item-level Creative Commons originals locally; publish attribution and manifests; keep NoDerivatives analysis derivatives local
    scope: 31 verified videos across four source-event groups, including 30 action-training-eligible videos and 3,379.96 seconds of eligible footage; sixteen additional discovered files currently fail transient retrieval checks
    notes: The 31 Bell Tower Classic 2012 clips are one event group and remain weapon-unknown. Thirteen 2016 Bell Tower action clips are visually reviewed foil while one interview is excluded. Team Foil is title-labelled foil and NoDerivatives; the Sports Attack item contributes only its reviewed multi-weapon instructional segment.

  - id: physiological_foil_elite_training_camp
    url: https://doi.org/10.18745/DS.26019
    status: usable_cc_by_version_unspecified
    repository_policy: cache the deposited snapshot and deidentified row table locally; publish code, hashes, attribution, and aggregates
    scope: 18 experienced foil fencers with physiology, body composition, heart rate, gas analysis, exertion, and motion timing measurements
    notes: The deposited README states CC-BY without a version; values are preserved exactly and do not generalize to epee or sabre.

  - id: peerj_elite_fencer_strength_and_lunge_velocity
    url: https://doi.org/10.7717/peerj.20879
    status: usable_cc_by_4_row_level
    repository_policy: cache both official XLSX supplements and publish normalized CC BY tables with attribution and checksums
    scope: 45 elite female fencers across epee, foil, and sabre with lunge velocity, strength, and jump measurements; 120 reliability trials from 40 study codes
    notes: Reliability trials are repeated measurements, not additional athletes; their letter codes are not joined to the primary participant codes without a published crosswalk.

  - id: peerj_professional_fencer_tdcs_cognition
    url: https://doi.org/10.7717/peerj.17288
    status: usable_cc_by_4_crossover_measurements
    repository_policy: cache the official supplement; keep direct-ID-free condition tables local and publish code, checksums, attribution, aggregates, and boundaries
    scope: 16 professional female fencers with 96 attention condition-mode rows and 32 stop-signal condition rows across sham and anodal tDCS sessions
    notes: Weapon and intervention order are absent from the supplement; acute laboratory changes are not match outcomes, causal performance evidence, clinical efficacy, or a training prescription.

  - id: figshare_u15_elite_sport_school_fencers
    url: https://doi.org/10.3389/fphys.2019.00405.s001
    status: usable_cc_by_4_privacy_minimized_local_rows
    repository_policy: cache the official CSV and keep the privacy-minimized 23-row fencing table local; publish code, hashes, attribution, counts, and claim boundaries
    scope: 23 U15 fencing athletes with anthropometry, eye-hand reaction time, back strength, resting heart rate, vital capacity, hemoglobin, and blood pressure within a 97-athlete six-sport study
    notes: Weapon and longitudinal training outcomes are absent. Source row labels, sex code, urine-protein code, and puberty or maturation fields are excluded from the analytic table.

  - id: peerj_professional_fencer_sleep_wake
    url: https://doi.org/10.7717/peerj.18812
    status: usable_cc_by_4_with_snapshot_discrepancies
    repository_policy: retain every supplement row locally; publish code, flags, checksums, and aggregates without inventing an inclusion rule
    scope: 2,607 wearable sleep rows across 25 study codes from professional fencing athletes
    notes: The article reports 2,459 valid days from 23 athletes and says 2023, while the supplement has 25 codes dated 2022; weapon labels are not published.

  - id: uhra_competitive_fencer_injury_survey
    url: https://doi.org/10.18745/ds.00026192
    status: usable_cc_by_injured_only_snapshot
    repository_policy: retain anonymous rows locally; publish code, checksums, and aggregates; do not model injury onset without uninjured controls
    scope: 270 injured competitive U.S. fencing respondents across all three weapons and up to five detailed injury slots
    notes: The deposited XLSX has 270 by 86 cells, not the README's stated 491 rows, and every row reports a prior fencing injury.

  - id: uhra_elite_fencer_hand_injury_survey
    url: https://doi.org/10.18745/ds.00027141
    status: usable_cc_by_with_snapshot_discrepancies
    repository_policy: omit open-text narratives from processed analytics; publish code, checksums, flags, and aggregates
    scope: 148 deposited rows from internationally competitive U.S. fencers across epee, foil, and sabre
    notes: The README reports 152 records and 142 eligible completed surveys; the CSV has 148 rows including seven fully empty rows, exact duplicates, and some ages below the stated inclusion threshold.

  - id: uhra_wheelchair_epee_oxygen_uptake
    url: https://doi.org/10.18745/ds.00027179
    status: usable_cc_by_4_with_snapshot_discrepancies
    repository_policy: cache the official ZIP; publish normalized anonymous tables, code, checksums, and aggregates with the missing-sheet warning
    scope: 11 elite wheelchair-epee participant summaries and 23,517 acquired second-level competition rows for participant codes F3 and F7
    notes: The README describes raw WFST and bout sheets plus seven competition participants, but the deposited ZIP contains CSV exports for only the summary sheet, F3, and F7; absent rows are not reconstructed.

  - id: figshare_womens_wheelchair_foil_temporal_structure
    url: https://doi.org/10.6084/m9.figshare.30598058.v1
    status: usable_cc_by_4_row_level
    repository_policy: cache the SAV and publish the 44-row bout table, codebook, checksums, attribution, and aggregates
    scope: 44 observed international women's wheelchair-foil direct-elimination bouts, 22 category A and 22 category B, with 107 source timing and sequence variables
    notes: Rows are bouts, not athlete identities; the deposit provides neither point-level actions nor source-video URLs.

  - id: figshare_three_weapon_handedness_rankings
    url: https://doi.org/10.6084/m9.figshare.30163016.v1
    status: usable_cc_by_4_name_minimized_row_level
    repository_policy: cache the official workbook; publish a direct-name-free ranking panel, code, checksums, attribution, and aggregates
    scope: 35,270 epee, foil, and sabre year-end top-300 ranking memberships from 2004-2023, representing 9,668 published name spellings and 9,600 normalized spelling keys
    notes: Rows are ranking memberships rather than independent athletes; missing handedness remains unknown and tied or repeated rank keys are preserved.

  - id: frontiers_2021_three_weapon_handedness_relative_age
    url: https://doi.org/10.3389/fspor.2021.662203
    status: usable_cc_by_4_privacy_minimized_row_level
    repository_policy: cache the official supplementary workbook; keep direct-ID-free panels local and publish code, checksums, attribution, aggregates, and the source discrepancy
    scope: 24,000 top-200 epee, foil, and sabre ranking memberships from 2007-2016 across 8,125 source athlete keys; 9,858 overlapping athlete-category memberships
    notes: Exact birth dates, direct source IDs, and full country names are removed. The annual flags sum to 23,998 rather than 24,000, and overlap with the separate 2004-2023 handedness panel is not entity-resolved or added as independent athletes.

  - id: figshare_youth_fencers_relative_age_2019
    url: https://doi.org/10.6084/m9.figshare.15183846.v2
    status: usable_cc_by_4_privacy_minimized_row_level
    repository_policy: cache the official workbook and keep the direct-ID-free 405-row fencing subset local; publish code, hashes, attribution, exact aggregates, and privacy transformations
    scope: 405 youth fencers ranked 1-20 in 2019 across epee, foil, and sabre, including 157 epee, 151 foil, and 97 sabre rows from U-11 through U-17
    notes: Exact birth dates and direct source IDs for minors are removed and age is rounded to one decimal year. Cross-sectional ranking rows are not bouts, longitudinal outcomes, current rankings, or evidence that birth timing causes performance.

  - id: frontiers_riposte_adapted_fencing_pilot
    url: https://doi.org/10.3389/fonc.2024.1335442.s001
    status: usable_cc_by_4_deidentified_attendance_and_published_aggregates
    repository_policy: cache the official supplement; publish deidentified attendance rows, group-level outcome estimates, code, hashes, attribution, and explicit clinical boundary
    scope: 24 adapted-fencing programme participants, 209 attended sessions, and 28 published group-level secondary-outcome rows
    notes: Participants are patients after breast-cancer surgery rather than competitive fencers. Outcome rows are aggregates rather than additional people, and this small pilot does not establish clinical efficacy or general athletic-training effects.

  - id: sciencedb_brazilian_ssbs_fencing_subset
    url: https://doi.org/10.57760/sciencedb.24779
    status: local_only_cc_by_nc_nd_4_small_sensitive_subset
    repository_policy: cache the source workbook and privacy-minimized five-row fencing subset locally; publish only code, hashes, counts, and claim boundaries
    scope: five fencing rows within a 250-athlete Brazilian supplement-belief survey, with six scale items and no weapon or performance outcome
    notes: The processed row table is not redistributed. Biological sex and detailed prescriber text are removed, age and practice duration are binned, and the five rows cannot support fencing-population or training-effect claims.

  - id: uhra_fencing_scoping_review_catalog
    url: https://doi.org/10.18745/ds.00026640
    status: license_conflict_official_page_cc_by_nd_4_readme_claims_cc_by_local_normalization_only
    repository_policy: cache the source and normalized row table locally; publish parser code, source links, checksums, attribution, and factual aggregates but not the normalized row-level derivative
    scope: 445 quantitative fencing and wheelchair-fencing study records across performance, physiology, psychology, biomechanics, injury, health, and training-load domains; 437 parseable reported sample-size cells sum to 236,863 study-reported observations
    notes: The official UHRA file page says CC BY-ND 4.0 while the deposited README says CC-BY, so the more restrictive statement governs publication. Reported sample-size totals can include overlapping cohorts, controls, repeated observations, or non-fencers and are never counted as acquired athletes or PisteFlow training rows.

  - id: scientific_reports_personalized_strength_cai
    url: https://doi.org/10.1038/s41598-025-29291-w
    status: local_only_cc_by_nc_nd_4_privacy_sensitive
    repository_policy: cache and analyze only locally; exclude raw and adapted row-level outputs from Git; publish code, hashes, counts, and claim boundaries only
    scope: 21 fencers with chronic ankle instability randomized across control, standardized, and personalized six-week strength-training groups, with 1,512 before/after and profile measurement cells
    notes: Weapon labels are absent; the workbook contains exact birth dates and five minors, so dates and row numbers are removed even from local processed tables.

  - id: uhra_three_weapon_tibial_impact_lunges
    url: https://doi.org/10.18745/ds.28796
    status: usable_cc_by_anonymous_repeated_measures
    repository_policy: cache the official workbook; publish processing code, hashes, attribution, aggregates, and privacy-minimized tables according to repository data policy
    scope: 69 real competition-site fencers across all three weapons, 1,235 nonmissing retained lunge-impact values, and 413 participant-surface means over six piste conditions
    notes: Five lunges were performed per surface but only three retained values are deposited after excluding extremes; tibial acceleration is an impact marker, not a measured injury outcome.

  - id: plos_temporal_demands_elite_fencing
    url: https://doi.org/10.1371/journal.pone.0285033
    status: usable_cc_by_4_published_aggregate
    repository_policy: cache article XML and the separate UHRA CC BY deposit; publish six modality benchmarks plus normalized bout/period summaries, checksums, and attribution
    scope: 83 final-round bouts across three weapons and two genders at the 2014 World Championships, with 83 bout rows and 200 period rows deposited
    notes: The article reports 5,900 Allez-to-Halte coded events, but those event rows are not deposited; source time headers say seconds although values are milliseconds and reproduce publication means only after division by 1,000.

  - id: plos_fencing_flick_supplements
    url: https://doi.org/10.1371/journal.pone.0222075
    status: usable_cc_by_4
    repository_policy: download all four supplements locally; publish a checksummed manifest and aggregate sheet inventory
    scope: two real 650-fps foil-flick trials, one simulation, and computed variables from two fencers

  - id: plos_fencing_lunge_simulator_video
    url: https://doi.org/10.1371/journal.pone.0218959
    status: usable_cc_by_4_supplementary_video
    repository_policy: cache the supplementary video with checksum, attribution, and a one-asset manifest
    scope: one 123.8-second 1080p demonstration video from a controlled lunge-simulator study
    notes: The study reports 11 participants and 1,320 attacks, but those trial rows are not published and are not counted as acquired samples.

  - id: kaggle_cc0_multi_sport_fencing_images
    url: https://www.kaggle.com/datasets/sheikhzaib/sports-image-image-classification
    status: usable_cc0_metadata_with_provenance_caveat
    repository_policy: extract fencing images locally; publish hashes, manifests, aggregates, and provenance caveat
    scope: 615 unique generic fencing still images within a 14,158-image, 22-sport archive
    notes: The dataset card does not document per-image origins; images have no weapon, athlete, action, or bout labels.

  - id: hmdb51_fencing_action_class
    url: https://www.kaggle.com/datasets/nguyenbon/hmdb51
    status: local_research_only_mixed_clip_rights
    repository_policy: extract and train locally; publish hashes, manifests, aggregate metrics, and source-group splits; do not redistribute clips
    scope: 116 broad fencing-action clips within the 51-class HMDB51 archive

  - id: ucf101_fencing_action_class
    url: https://www.crcv.ucf.edu/research/data-sets/ucf101/
    status: local_research_only_terms_unverified_verified_mirror_bytes
    repository_policy: use official split lists and selectively range-fetch the 111 Fencing members from a pinned 6.96 GB mirror ZIP; keep media local and publish hashes only
    scope: 111 broad fencing-action clips across 25 source groups
    notes: The downloader validates ZIP size, CRC-32, and AVI RIFF signatures. Clips have no epee/foil/sabre labels and must be group-split. The previous CRCV per-clip URL returned HTML and is rejected. The class mixes sport fencing, rapier or historical practice, stage combat, and film; it is not a three-weapon label source.

  - id: youtube8m_fencing_video_level_memberships
    url: https://research.google.com/youtube8m/explore.html
    status: official_cc_by_4_metadata_and_features_underlying_media_link_only
    repository_policy: publish the complete anonymous-ID membership, current official YouTube-ID mappings, current oEmbed availability, title-derived discovery hints, and cross-manifest overlap; do not download or redistribute underlying YouTube media

  - id: osf_three_weapons_junior_world_cup_corpus
    url: https://osf.io/jtb8h/
    status: usable_cc_by_4_privacy_minimized_with_source_anomalies
    repository_policy: cache the pinned archive locally; publish direct-name-free Parquet tables, processing code, hashes, attribution, and a complete contradiction audit
    scope: 158,652 junior pool bouts across 474 competitions and all three weapons, plus 54,637 entry rows and 66,090 deposited ranking rows
    notes: This is a third-party transcription of public FIE PDFs, not an official FIE export. Outcome training excludes 71 tied-score rows and one winner-score conflict. One ranking duplicate is removed, six same-name event collisions are flagged, unreliable age and birth-year fields are removed, and the author-held PDF-to-CSV parser is absent.

  - id: osf_national_sabre_eye_tracking
    url: https://osf.io/ynkx3/
    status: public_download_unknown_license_sensitive_local_only
    repository_policy: keep raw and privacy-minimized sample, event, and touch tables local; publish code, exact hashes, aggregates, and reconciliation diagnostics only
    scope: main study with 623,397 eye-tracker rows from 10 national-level sabre fencers, 420 coded rows including 379 supervised touches, plus a 575-touch pilot from 14 participant labels
    notes: Sensor rows are repeated 100-Hz samples, not independent athletes or touches. Main/pilot participant overlap is unresolved. Defensive participant aggregates do not fully recompute from the deposited touch rows, no video is deposited, and no reuse license is declared.

  - id: osf_fencer_psychology_coping
    url: https://osf.io/pa7fc/
    status: public_download_unknown_license_psychologically_sensitive_local_only
    repository_policy: keep raw and privacy-minimized rows local; publish code, hashes, scale counts, aggregate weapon counts, and anomaly flags only
    scope: 78 fencers including 4 foil, 68 epee, and 6 sabre rows with training volume, perfectionism, coping, and psychological-inflexibility measures
    notes: Cross-sectional self-report data are not diagnoses or training effects. Exact ages and dates plus deposited cluster labels are excluded; two weapon-code disagreements and four duration inconsistencies are flagged.

  - id: osf_epee_attack_attention
    url: https://osf.io/8bnqg/?view_only=438acf07f7b04e1a8671c5b6ce62b810
    status: view_only_download_unknown_license_local_only
    repository_policy: keep all source and row-level files local; publish acquisition code, exact hashes, counts, reconciliation diagnostics, and non-reconstructive aggregates only
    scope: 24 adult epee participants, 24 attack-summary rows, and 144 COVAT condition-mean rows across beginner and advanced groups
    notes: The 720 individual attack trials are described but not deposited. The advanced files use E1-E12 versus S1-S12; the local crosswalk is flagged as inferred from numeric suffixes and exact three-decimal mean reconciliation. This is cross-sectional laboratory data, not a training intervention or bout outcome.

  - id: sensors_iot_balance_feedback_training
    url: https://doi.org/10.3390/s23249801
    status: usable_cc_by_4_repeated_measures_on_minors
    repository_policy: cache the official supplement and keep participant rows local; publish parser code, pinned inner hashes, attribution, aggregate changes, and source-anomaly diagnostics
    scope: 30 juvenile fencers in control, visual-feedback, and haptic-feedback groups, measured at Week 0 and Week 5 for 60 participant-time rows and 180 measurement cells
    notes: The same 30 people generate both visits; weapon is not reported. Table S4 omits one printed mean, while derived Tables S10-S12 reverse or mistype values and mislabel haptic headings, so only the 60 raw rows in Tables S1-S6 are parsed.

  - id: plos_fencer_cognition_fitness_blood
    url: https://doi.org/10.1371/journal.pone.0251907
    status: usable_cc_by_4_privacy_minimized_health_panel
    repository_policy: cache both official workbooks; keep the joined direct-code-free row table local and publish code, hashes, attribution, counts, and the upstream outlier flag
    scope: 18 fencers with fitness, cognitive-task, and basal/post blood measures
    notes: Weapon is absent and repeated pre/post columns are not extra participants. Exact study codes and ages are removed; the source-styled F2 post-CTSB outlier is retained with a flag.

  - id: plos_elite_fencer_back_pain_subset
    url: https://doi.org/10.1371/journal.pone.0180130
    status: usable_cc_by_4_privacy_minimized_self_report
    repository_policy: cache the official SPSS file and keep the 23-row fencer table local; publish code, hashes, attribution, aggregates, and claim boundaries
    scope: 23 elite fencers within a 1,280-row German athlete/control survey, with training volume, cadre, pain periods, and pain intensity
    notes: Weapon is absent and outcomes are self-reported, not diagnoses. All 23 report lifetime back pain, so the subset cannot train an ever-injured versus never-injured classifier. Exact age, height, weight, and experience years are removed or coarsened.
    scope: 346 official May 2018 video-level memberships for the broad Fencing label /m/02y8z
    notes: The CC BY 4.0 license covers YouTube-8M labels and precomputed features, not the linked videos. Membership is machine-generated and has no weapon, athlete, bout, touch, action, or frame-level ground truth. Public-link availability is not media licensing.

